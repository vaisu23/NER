name: Sync Backend to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'app/backend/**'

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend folder to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd app/backend

          git init
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

          git remote add space https://Vaisu23:$HF_TOKEN@huggingface.co/spaces/Vaisu23/Ner_app_b

          git add .

          git commit -m "Deploy backend to HF Space" || echo "No changes"

          git push --force space HEAD:main
